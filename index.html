<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTokバズ分析＆コンテンツ自動生成AI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0d081a 100%);
      color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .btn-active {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: rgba(234, 179, 8, 0.8) !important;
      color: #fde047 !important;
      font-weight: bold;
    }
    /* 改行コード（\n）を画面上にそのまま反映させる設定 */
    .preserve-newlines {
      white-space: pre-wrap !important;
      word-break: break-word !important;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="p-5 text-center border-b border-yellow-500/20 glass-card sticky top-0 z-50">
    <div class="flex items-center justify-center gap-2">
      <i class="fa-solid fa-crown text-yellow-400 text-xl"></i>
      <h1 class="text-xl font-extrabold tracking-wider gold-gradient-text">バズ分析＆コンテンツ自動生成AI Pro</h1>
    </div>
    <p class="text-xs text-purple-200 mt-1">TikTok台本 → バズ度採点・最適化 → note記事 完全自動生成</p>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Tips Card -->
    <div class="glass-card rounded-2xl p-4 border-yellow-500/30">
      <h3 class="text-xs font-bold gold-gradient-text mb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-lightbulb"></i> 攻略ワンポイントアドバイス
      </h3>
      <div class="grid grid-cols-2 gap-2 text-[11px] text-gray-300">
        <div class="bg-black/30 p-2 rounded-lg border border-white/5">
          <p class="font-bold text-yellow-300 mb-1"><i class="fa-brands fa-tiktok"></i> TikTokバズ時間</p>
          <p>・平日：18:00〜21:00</p>
          <p>・休日：11:00〜13:00</p>
          <p class="text-pink-300">・深夜帯：22:00〜24:00</p>
        </div>
        <div class="bg-black/30 p-2 rounded-lg border border-white/5">
          <p class="font-bold text-yellow-300 mb-1"><i class="fa-solid fa-book"></i> note適正文字数</p>
          <p>・集客・誘導：500〜1,000字</p>
          <p>・解説記事：1,500〜2,000字</p>
          <p>・有料コンテンツ：3,000字〜</p>
        </div>
      </div>
    </div>

    <!-- Option Selector -->
    <div class="glass-card rounded-2xl p-5 space-y-4">
      <h3 class="text-xs font-bold gold-gradient-text flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> 出力条件設定
      </h3>
      
      <!-- TikTok Length -->
      <div>
        <label class="text-[11px] text-gray-300 mb-1.5 block">TikTok 動画尺</label>
        <div class="flex gap-2">
          <button id="tiktok-15s" onclick="setTiktokLength('15秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">15秒</button>
          <button id="tiktok-30s" onclick="setTiktokLength('30秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all btn-active">30秒</button>
          <button id="tiktok-60s" onclick="setTiktokLength('60秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">60秒</button>
        </div>
      </div>

      <!-- note Word Count -->
      <div>
        <label class="text-[11px] text-gray-300 mb-1.5 block">note 記事文字数</label>
        <div class="flex gap-2">
          <button id="note-500" onclick="setNoteWords('500文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all btn-active">500文字</button>
          <button id="note-1000" onclick="setNoteWords('1000文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">1000文字</button>
          <button id="note-2000" onclick="setNoteWords('2000文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">2000文字</button>
        </div>
      </div>

      <!-- Custom CTA Input -->
      <div>
        <label class="text-[11px] text-gray-300 mb-1.5 block">末尾の誘導文（CTA設定）</label>
        
        <select id="cta-preset" onchange="applyCtaPreset()" class="w-full bg-black/50 text-xs border border-white/20 rounded-lg p-2 mb-2 text-yellow-300 font-medium focus:outline-none">
        </select>

        <div class="space-y-2">
          <input type="text" id="cta-text" placeholder="新しい誘導文を入力して保存できます" class="w-full bg-black/40 text-xs border border-white/20 rounded-lg p-2 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-yellow-400">
          
          <div class="flex gap-2 justify-end">
            <button onclick="deleteSelectedCta()" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs rounded-lg border border-red-500/40 flex items-center gap-1">
              <i class="fa-solid fa-trash-can"></i> 選択中の項目を削除
            </button>
            <button onclick="saveCustomCta()" class="px-3 py-1.5 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-300 text-xs rounded-lg border border-yellow-500/40 flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> プルダウンに保存
            </button>
          </div>
        </div>
        <p id="save-msg" class="text-[10px] mt-1.5 hidden"></p>
      </div>
    </div>

    <!-- Mode Selection -->
    <div class="glass-card rounded-2xl p-5">
      <h3 class="text-sm font-bold gold-gradient-text mb-3 flex items-center gap-2">
        <i class="fa-solid fa-list-check"></i> バズタイトルを選択して生成・採点
      </h3>
      
      <div class="space-y-2 text-xs">
        <button onclick="selectTheme(0)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>① 「既読無視する男の本音、実は〇〇です」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(1)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>② 「『好き避け』と『嫌い避け』の見分け方」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(2)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>③ 「復縁できる女子が絶対にやらないLINE」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(3)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>④ 「本命の女性にだけ無意識に出すサイン3選」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(4)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>⑤ 「一瞬で冷められる沼らせLINEの共通点」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
      </div>
    </div>

    <!-- Output Section -->
    <div id="output-section" class="hidden space-y-4">
      
      <!-- Score & Analysis Card -->
      <div class="glass-card rounded-2xl p-5 border-yellow-500/50 bg-yellow-500/5">
        <div class="flex items-center justify-between mb-3 border-b border-yellow-500/20 pb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-yellow-400"></i>
            <span class="text-xs font-bold text-yellow-300">AIバズ度診断結果</span>
          </div>
          <div class="flex items-center gap-2">
            <span id="buzz-rank" class="px-2 py-0.5 text-[10px] font-bold rounded bg-yellow-500/30 text-yellow-300 border border-yellow-500/50">評価: Sランク</span>
            <div class="flex items-baseline gap-1">
              <span class="text-2xl font-black text-yellow-400" id="buzz-score">94</span>
              <span class="text-xs text-gray-400">/ 100点</span>
            </div>
          </div>
        </div>
        
        <div id="buzz-analysis" class="text-xs text-gray-300 space-y-1.5 leading-relaxed">
        </div>

        <div id="boost-btn-container" class="mt-4 pt-3 border-t border-white/10 hidden">
          <button onclick="boostContent()" class="w-full py-2.5 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-black font-extrabold text-xs rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-bolt text-sm"></i> バズ度を95点以上に自動最適化（点数アップ）
          </button>
        </div>
      </div>

      <!-- Result Card -->
      <div class="glass-card rounded-2xl p-5 border-yellow-500/40">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs text-yellow-400 font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="content-status-title">最適化コンテンツ</span>
          </span>
          <button onclick="copyAll()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full text-gray-200 flex items-center gap-1">
            <i class="fa-regular fa-copy"></i> 全体コピー
          </button>
        </div>
        
        <!-- preserve-newlines クラスを指定して改行を保持 -->
        <div id="result-content" class="text-xs text-gray-200 leading-relaxed max-h-[500px] overflow-y-auto p-3 bg-black/40 rounded-lg border border-white/5 select-text preserve-newlines">
        </div>
      </div>
    </div>

  </main>

  <script>
    let tiktokLength = '30秒';
    let noteWords = '500文字';
    let currentThemeIndex = 0;
    let currentScore = 94;

    const defaultPresets = [
      { type: 'default', text: '基本：気になる方はプロフィールのリンクから' },
      { type: 'default', text: '恋愛：プロフィールの「無料相性診断」を試してみてね！' },
      { type: 'default', text: '占い：プロフィールリンクからあの人との相性を占えます！' },
      { type: 'default', text: '副業・ビジネス：無料のマガジンはプロフィールから' },
      { type: 'default', text: 'LINE誘導：公式LINEからチェックしてみてね！' }
    ];

    function getCustomPresets() {
      const saved = localStorage.getItem('user_cta_list');
      return saved ? JSON.parse(saved) : [];
    }

    function renderDropdown(selectedText = null) {
      const select = document.getElementById('cta-preset');
      const customs = getCustomPresets();
      
      let html = '<option value="manual">▼ 新規入力（下部に入力して保存）</option>';

      if (customs.length > 0) {
        html += '<optgroup label="★ 保存済みのカスタム誘導文">';
        customs.forEach((item, index) => {
          html += `<option value="custom_${index}">★ ${item}</option>`;
        });
        html += '</optgroup>';
      }

      html += '<optgroup label="▼ 標準プリセット">';
      defaultPresets.forEach((item, index) => {
        html += `<option value="default_${index}">${item.text}</option>`;
      });
      html += '</optgroup>';

      select.innerHTML = html;

      if (selectedText) {
        const customIdx = customs.indexOf(selectedText);
        if (customIdx !== -1) {
          select.value = `custom_${customIdx}`;
          document.getElementById('cta-text').value = selectedText;
          return;
        }
        const defaultIdx = defaultPresets.findIndex(p => p.text === selectedText);
        if (defaultIdx !== -1) {
          select.value = `default_${defaultIdx}`;
          document.getElementById('cta-text').value = selectedText;
          return;
        }
      }
      
      if (customs.length > 0) {
        select.value = 'custom_0';
        document.getElementById('cta-text').value = customs[0];
      } else {
        select.value = 'default_1';
        document.getElementById('cta-text').value = 'プロフィールの「無料相性診断」を試してみてね！';
      }
    }

    function applyCtaPreset() {
      const select = document.getElementById('cta-preset');
      const input = document.getElementById('cta-text');
      const val = select.value;

      if (val === 'manual') {
        input.value = '';
        input.focus();
      } else if (val.startsWith('custom_')) {
        const idx = parseInt(val.replace('custom_', ''));
        const customs = getCustomPresets();
        if (customs[idx]) input.value = customs[idx];
      } else if (val.startsWith('default_')) {
        const idx = parseInt(val.replace('default_', ''));
        if (defaultPresets[idx]) {
          const raw = defaultPresets[idx].text;
          input.value = raw.includes('：') ? raw.split('：')[1] : raw;
        }
      }
    }

    function saveCustomCta() {
      const input = document.getElementById('cta-text');
      const text = input.value.trim();

      if (!text) {
        showStatusMsg('文章を入力してください', true);
        return;
      }

      let customs = getCustomPresets();
      if (!customs.includes(text)) {
        customs.unshift(text);
        localStorage.setItem('user_cta_list', JSON.stringify(customs));
        renderDropdown(text);
        showStatusMsg('プルダウンに保存しました！');
      } else {
        showStatusMsg('すでに登録されています', true);
      }
    }

    function deleteSelectedCta() {
      const select = document.getElementById('cta-preset');
      const val = select.value;

      if (val.startsWith('custom_')) {
        const idx = parseInt(val.replace('custom_', ''));
        let customs = getCustomPresets();
        customs.splice(idx, 1);
        localStorage.setItem('user_cta_list', JSON.stringify(customs));
        renderDropdown();
        showStatusMsg('プルダウンから削除しました', true);
      } else if (val.startsWith('default_')) {
        showStatusMsg('標準プリセットは削除できません', true);
      } else {
        showStatusMsg('削除する項目を選択してください', true);
      }
    }

    function showStatusMsg(text, isError = false) {
      const msg = document.getElementById('save-msg');
      msg.className = `text-[10px] mt-1.5 ${isError ? 'text-red-400' : 'text-green-400'}`;
      msg.innerHTML = isError ? `<i class="fa-solid fa-circle-exclamation"></i> ${text}` : `<i class="fa-solid fa-check"></i> ${text}`;
      msg.classList.remove('hidden');
      setTimeout(() => {
        msg.classList.add('hidden');
      }, 2000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDropdown();
    });

    const tiktokTemplates = {
      2: {
        '15秒': `【TikTok投稿用台本（15秒仕様）】\nタイトル：【神回】復縁できる女子が絶対にやらないLINE3選\n\n復縁したいから属性で焦ってLINE送ってない？\n\nこれを知っておくだけで復縁率は跳ね上がります！\n\n絶対にダメなのは「未練だらけの長文」と「用事のない探り」。\n\n本当に復縁できる人は相手を惹きつけるタイミングを狙ってます。\n\n{CTA}\n\n#復縁 #元彼 #LINE術 #恋愛心理 #復縁テク #自分磨き`,

        '30秒': `【TikTok投稿用台本（30秒仕様）】\nタイトル：【バズ確定】復縁できる女子が絶対にやらないLINE\n\n「元彼とやり直したい…」そう思って焦ってLINEを送っていませんか？\n\n復縁できる女子が「絶対にやらないLINE」があります。\n\n1つ目。「長文での感謝や反省を伝えるLINE」\n\n2つ目。「『最近どう？』などの用事のない探りLINE」\n\n3つ目。「返事がないのに連続で送る追いLINE」\n\nこれらはすべて「重い」と感じさせ、ブロックの原因になります。\n\n復縁で大切なのは「引く勇気」と「タイミングを見極めること」。\n\n{CTA}\n\n#復縁 #元彼 #LINE術 #恋愛心理 #復縁テク #自分磨き`,

        '60秒': `【TikTok投稿用台本（60秒仕様）】\nタイトル：【完全版】復縁できる女子が絶対にやらないLINE\n\n別れたあと、「どうしてもやり直したい」と思って焦ってLINEを送ってしまう人はとても多いです。\n\n発生しやすいNG行動を知っておくだけで、復縁率は上がります。\n\n復縁できる女子が「絶対にやらないLINE」の共通点をみていきましょう。\n\n1つ目。「長文での感謝や反省を伝えるLINE」\n別れた直後にこれを送ると、相手は重く感じてさらに心を閉じます。\n\n2つ目。「用事のない探りLINE」\n『最近どう？』などは未練が透けて見えて警戒されます。\n\n3つ目。「お酒の勢いで送る夜中のLINE」\n感情的な行動は一発で嫌われます。\n\n4つ目。「返事がないのに連続で送る追いLINE」\n圧迫感を与えてブロックの原因になります。\n\n復縁できる女子は、一度しっかり距離を置い、相手の警戒がとけたタイミングで「かるい用事」だけを送ります。\n\n{CTA}\n\n#復縁 #元彼 #LINE術 #恋愛心理 #復縁テク #自分磨き`
      }
    };

    const noteTemplates = {
      2: {
        '500文字': `【note記事本文（500文字仕様）】\nタイトル：復縁できる女子が絶対にやらないLINE〜焦りを捨てて復縁率を跳ね上げる方法〜\n\n「どうしても彼とやり直したい…」\n別れた直後、焦りや寂しさからスマホを手放せなくなる気持ちはとてもよく分かります。\n\nしかし、復縁を成功させる女性たちが「絶対にやらないLINE」が存在します。\n\n1. 感謝や反省を綴った長文LINE\n2. 「最近どう？」といった用事のない探りLINE\n3. 反応がないのに送ってしまう追撃LINE\n\nこれらに共通しているのは「自分の不安を解消するためのLINE」である点です。受け取った相手はプレッシャーを感じ、さらに心を閉ざしてしまいます。\n\n復縁で最も大切なのは、一度しっかり距離を置くこと（冷却期間）。相手の警戒心が和らいだタイミングで、重さを感じさせない軽い連絡を入れるのが成功の鍵です。\n\n【無料体験版の注意点】\n※本AIツールの無料版は「5回までの利用制限」がございます。無制限利用やプレミアム機能をご希望の場合は、有料プランへの加入をご検討ください。\n\n{CTA}\n\n#復縁 #元彼 #LINE術 #恋愛心理 #復縁テク #自分磨き`,

        '1000文字': `【note記事本文（1000文字仕様）】\nタイトル：復縁できる女子が絶対にやらないLINE〜焦りを捨てて復縁率を跳ね上げる方法〜\n\n別れたあとに「やっぱり彼しかいない」と気づき、どうにか関係を修復したいと願う女性は少なくありません。\nしかし、焦って送った1本のLINEが原因で、復縁の可能性を自ら潰してしまうケースが非常に多いのが現実です。\n\n今回は、復縁できる女子が「絶対にやらないLINE」と、関係を再構築するための正しい立ち回りについて解説します。\n\n■ 復縁できる女子が「絶対にやらないLINE」4選\n\n1. 感謝や反省を伝える長文LINE\n「今までありがとう」「私が悪かった」と長文で送ると、相手は「重い」「返信に困る」と感じて警戒を強めます。\n\n2. 用事のない「探りLINE」\n「元気に設定してる？」「最近寒いね」など、理由のない連絡は未練が透けて見え、返信の優先度を下げられます。\n\n3. お酒の勢いで送る夜中のLINE\n感情に任せた連絡は「都合のいい存在」に見られるか、一気に価値を下げてしまう危険があります。\n\n4. 返信が来ないのに送る追いLINE\n連続でメッセージが届くと、相手は恐怖や嫌悪感を覚え、最悪の場合ブロックにつながります。\n\n■ 復縁を成功させるための正解ルート\n\n復縁に成功する女性は、「一度しっかり引くこと」ができます。\n相手の警戒心が解けるまで冷却期間を置き、連絡をする際は「短く・軽やかな用件」だけを伝えるのが鉄則です。\n\n【無料体験版の注意点】\n※本AIツールの無料版は「5回までの利用制限」がございます。無制限利用やプレミアム機能をご希望の場合は、有料プランへの加入をご検討ください。\n\n{CTA}\n\n#復縁 #元彼 #LINE術 #恋愛心理 #復縁テク #自分磨き`,

    function setTiktokLength(len) {
      tiktokLength = len;
      ['15s', '30s', '60s'].forEach(id => {

      });
      document.getElementById('tiktok-' + len.replace('秒', 's')).classList.add('btn-active');
    }

    function setNoteWords(words) {
      noteWords = words;
      ['500', '1000', '2000'].forEach(id => {
        document.getElementById('note-' + id).classList.remove('btn-active');
      });
      document.getElementById('note-' + words.replace('文字', '')).classList.add('btn-active');
    }

      currentThemeIndex = index;
      generateContent();
    }
