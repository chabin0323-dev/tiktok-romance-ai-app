    // プルダウンの再描画

      // ユーザー保存分（★付きで一番上に表示）
      if (customs.length > 0) {
        html += '<optgroup label="★ 保存済みのカスタム誘導文">';
        customs.forEach((item, index) => {
          html += `<option value="custom_${index}">★ ${item}</option>`;
        });
        html += '</optgroup>';
      }

      // デフォルトプリセット
      html += '<optgroup label="▼ 標準プリセット">';
      defaultPresets.forEach((item, index) => {
        html += `<option value="default_${index}">${item.text}</option>`;
      });
      html += '</optgroup>';

      select.innerHTML = html;

      // 選択状態の復元
      if (selectedText) {
        const customIdx = customs.indexOf(selectedText);
        if (customIdx !== -1) {
          select.value = `custom_${customIdx}`;
          document.getElementById('cta-text').value = selectedText;
          return;
        }
        const defaultIdx = defaultPresets.findIndex(p => p.text === selectedText);
        if (defaultIdx !== -1) {
          select.value = `default_${defaultIdx}`;
          document.getElementById('cta-text').value = selectedText;
          return;
        }
      }
      
      // デフォルト初期値
      if (customs.length > 0) {
        select.value = 'custom_0';
        document.getElementById('cta-text').value = customs[0];
      } else {
        select.value = 'default_1'; // 恋愛用をデフォルトに
        document.getElementById('cta-text').value = 'プロフィールの「無料相性診断」を試してみてね！';
      }
    }

    // プルダウン変更時
    function applyCtaPreset() {
      const select = document.getElementById('cta-preset');
      const input = document.getElementById('cta-text');
      const val = select.value;

      if (val === 'manual') {
        input.value = '';
        input.focus();
      } else if (val.startsWith('custom_')) {
        const idx = parseInt(val.replace('custom_', ''));
        const customs = getCustomPresets();
        if (customs[idx]) input.value = customs[idx];
      } else if (val.startsWith('default_')) {
        const idx = parseInt(val.replace('default_', ''));
        if (defaultPresets[idx]) {
          // 接頭辞（恋愛：など）を外したテキストをセット
          const raw = defaultPresets[idx].text;
          input.value = raw.includes('：') ? raw.split('：')[1] : raw;
        }
      }
    }

    // 新規追加保存
    function saveCustomCta() {
      const input = document.getElementById('cta-text');
      const text = input.value.trim();

      if (!text) {
        showStatusMsg('文章を入力してください', true);
        return;
      }

      let customs = getCustomPresets();
      if (!customs.includes(text)) {
        customs.unshift(text); // 先頭に追加
        localStorage.setItem('user_cta_list', JSON.stringify(customs));
        renderDropdown(text);
        showStatusMsg('プルダウンに保存しました！');
      } else {
        showStatusMsg('すでに登録されています', true);
      }
    }

    // 選択項目の削除
    function deleteSelectedCta() {
      const select = document.getElementById('cta-preset');
      const val = select.value;

      if (val.startsWith('custom_')) {
        const idx = parseInt(val.replace('custom_', ''));
        let customs = getCustomPresets();
        customs.splice(idx, 1);
        localStorage.setItem('user_cta_list', JSON.stringify(customs));
        renderDropdown();
        showStatusMsg('プルダウンから削除しました', true);
      } else if (val.startsWith('default_')) {
        showStatusMsg('標準プリセットは削除できません', true);
      } else {
        showStatusMsg('削除する項目を選択してください', true);
      }
    }

    function showStatusMsg(text, isError = false) {
      const msg = document.getElementById('save-msg');
      msg.className = `text-[10px] mt-1.5 ${isError ? 'text-red-400' : 'text-green-400'}`;
      msg.innerHTML = isError ? `<i class="fa-solid fa-circle-exclamation"></i> ${text}` : `<i class="fa-solid fa-check"></i> ${text}`;
      msg.classList.remove('hidden');
      setTimeout(() => {
        msg.classList.add('hidden');

相手に「あれ、なんだか前と雰囲気が違うな」と感じさせることができれば、再び彼から追われる関係を作ることができます。

### まとめ

復縁で最も必要なのは、焦りを抑える「余裕」です。
あなたの魅力を再確認してもらうためにも、まずは冷静になって次のステップを準備していきましょう。

{CTA}

#復縁 #元彼 #LINEテクニック #恋愛心理 #復縁方法 #自分磨き #恋愛カウンセリング`
      }
    };

    function setTiktokLength(len) {
      tiktokLength = len;
      ['15s', '30s', '60s'].forEach(id => {
        document.getElementById('tiktok-' + id).classList.remove('btn-active');
      });
      document.getElementById('tiktok-' + len.replace('秒', 's')).classList.add('btn-active');
    }

    function setNoteWords(words) {
      noteWords = words;
      ['500', '1000', '2000'].forEach(id => {
        document.getElementById('note-' + id).classList.remove('btn-active');
      });
      document.getElementById('note-' + words.replace('文字', '')).classList.add('btn-active');
    }

    function selectTheme(index) {
      currentThemeIndex = index;
      generateContent();
    }

    function generateContent() {
      const output = document.getElementById('output-section');
      const resultContent = document.getElementById('result-content');
      const customCta = document.getElementById('cta-text').value.trim() || '気になる方はプロフィールのリンクから';
      
      output.classList.remove('hidden');
      resultContent.innerHTML = `AIが構成・台本(${tiktokLength})・note記事(${noteWords})を一括生成中...`;

      output.scrollIntoView({ behavior: 'smooth' });

      setTimeout(() => {
        let ttTemplate = (tiktokTemplates[currentThemeIndex] && tiktokTemplates[currentThemeIndex][tiktokLength]) 
          ? tiktokTemplates[currentThemeIndex][tiktokLength] 
          : tiktokTemplates[2][tiktokLength];

        let ntTemplate = (noteTemplates[currentThemeIndex] && noteTemplates[currentThemeIndex][noteWords]) 
          ? noteTemplates[2][noteWords] 
          : noteTemplates[2][noteWords];

        let ttText = ttTemplate.replace('{CTA}', customCta);
        let ntText = ntTemplate.replace('{CTA}', customCta);

        resultContent.innerHTML = `【TikTok投稿用台本（${tiktokLength}仕様）】
${ttText}

----------------------------------------

【note記事本文（${noteWords}仕様）】
${ntText}

----------------------------------------

【画像生成プロンプト】
・TikTok用: Realistic vertical photo, a thoughtful Japanese person looking at a smartphone, minimal aesthetic, soft lighting, 8k.
・note用: Clean minimalist background, neutral aesthetic, high resolution.`;
      }, 800);
    }

    function copyAll() {
      const text = document.getElementById('result-content').innerText;
      navigator.clipboard.writeText(text);
      alert('生成内容をコピーしました！');
    }
  </script>
