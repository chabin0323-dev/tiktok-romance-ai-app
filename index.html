<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz Analysis & Content Auto-Generation AI Pro</title>
    <style>
        :root {
            --bg-color: #0f0c20;
            --card-bg: #1a103c;
            --text-color: #f3f4f6;
            --accent-gold: #ffe259;
            --accent-gold-dark: #ffa751;
            --border-color: rgba(255, 215, 0, 0.2);
            --button-gold: #ffe259;
            --button-gold-hover: #ffa751;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #000;
            border: 12px solid #333;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .section-header {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .section-header span.number {
            background-color: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            width: 25px;
            height: 25px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
            font-size: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background-color: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .save-btn {
            background-color: var(--button-gold);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        .keyword-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .keyword-card {
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .keyword-card .copy-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }

        .keyword-card span.copy-text {
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            align-self: flex-end;
        }

        .keyword-card.gold { border: 1px solid #ffe259; color: #ffe259; }
        .keyword-card.blue { border: 1px solid #4a90e2; color: #4a90e2; }
        .keyword-card.pink { border: 1px solid #e24a90; color: #e24a90; }
        .keyword-card.purple { border: 1px solid #904ae2; color: #904ae2; }

        .dropdown-container {
            position: relative;
            margin-top: 20px;
        }

        select {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
            font-size: 14px;
        }

        .dropdown-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-color);
            pointer-events: none;
        }

        .action-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .delete-btn {
            background-color: #3c1020;
            color: #ff4a90;
            border: 1px solid rgba(255, 74, 144, 0.2);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .optimized-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }

        .optimized-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .optimized-header span {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 16px;
        }

        .optimized-header button {
            background-color: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="app-container">
            <h1>バズ分析 & コンテンツ自動生成 AI Pro</h1>

            <div class="section">
                <div class="section-header">
                    <span class="number">STEP0</span>
                    バズタイトルをコピペして保存
                </div>
                <textarea rows="3" placeholder="ここにバズタイトルを貼り付けてください..."></textarea>
                <button class="save-btn">+ プルダウンに保存</button>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="number">STEP1</span>
                    検索キーワードのお勧め
                </div>
                <p style="font-size: 12px; color: #888; margin-top: -10px; margin-bottom: 15px;">バズっているタイトルを見つけるための、お勧めの検索キーワードを提案します。タップしてコピーできます。</p>
                <div class="keyword-grid">
                    <div class="keyword-card gold">
                        <span>【決定版】復縁したい 女子 LINE術</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                    <div class="keyword-card blue">
                        <span>男が冷められない沼 らせLINE共通点</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                    <div class="keyword-card purple">
                        <span>本命に無意識に出す サイン</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                    <div class="keyword-card pink">
                        <span>既読無視 男 本音 〇〇</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                    <div class="keyword-card gold">
                        <span>【永久保存版】「好き 避け」 「嫌い避け」</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                    <div class="keyword-card blue">
                        <span>LINE 即バレ注意！ 本命女性</span>
                        <span class="copy-icon">⎘</span>
                        <span class="copy-text">コピー</span>
                    </div>
                </div>
            </div>

            <div class="dropdown-container">
                <select>
                    <option>あの人との相性はプロフィールリンクから</option>
                </select>
                <span class="dropdown-icon">▼</span>
            </div>

            <div class="action-btns">
                <button class="delete-btn">選択中の項目を削除</button>
                <button class="save-btn">+ プルダウンに保存</button>
            </div>

            <div class="optimized-content">
                <div class="optimized-header">
                    <span>最適化コンテンツ</span>
                    <button>全体コピー</button>
                </div>
                <textarea rows="5" placeholder="【TikTok投稿用台本 (60秒仕様)】"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
