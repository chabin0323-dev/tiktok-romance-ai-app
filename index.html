<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok恋愛バズ分析＆自動生成AI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0d081a 100%);
      color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-button {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      color: #1a103c;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .gold-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .btn-active {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: rgba(234, 179, 8, 0.8) !important;
      color: #fde047 !important;
      font-weight: bold;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="p-5 text-center border-b border-yellow-500/20 glass-card sticky top-0 z-50">
    <div class="flex items-center justify-center gap-2">
      <i class="fa-solid fa-crown text-yellow-400 text-xl"></i>
      <h1 class="text-xl font-extrabold tracking-wider gold-gradient-text">恋愛バズ分析＆生成AI Pro</h1>
    </div>
    <p class="text-xs text-purple-200 mt-1">TikTok → 無料相性診断 → note 完全自動化ツール</p>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Tips Card -->
    <div class="glass-card rounded-2xl p-4 border-yellow-500/30">
      <h3 class="text-xs font-bold gold-gradient-text mb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-lightbulb"></i> 攻略ワンポイントアドバイス
      </h3>
      <div class="grid grid-cols-2 gap-2 text-[11px] text-gray-300">
        <div class="bg-black/30 p-2 rounded-lg border border-white/5">
          <p class="font-bold text-yellow-300 mb-1"><i class="fa-brands fa-tiktok"></i> TikTokバズ時間</p>
          <p>・平日：18:00〜21:00</p>
          <p>・休日：11:00〜13:00</p>
          <p class="text-pink-300">・深夜帯：22:00〜24:00</p>
        </div>
        <div class="bg-black/30 p-2 rounded-lg border border-white/5">
          <p class="font-bold text-yellow-300 mb-1"><i class="fa-solid fa-book"></i> note適正文字数</p>
          <p>・集客・誘導：500〜1,000字</p>
          <p>・解説記事：1,500〜2,000字</p>
          <p>・有料コンテンツ：3,000字〜</p>
        </div>
      </div>
    </div>

    <!-- Option Selector -->
    <div class="glass-card rounded-2xl p-5 space-y-4">
      <h3 class="text-xs font-bold gold-gradient-text flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> 出力条件設定
      </h3>
      
      <!-- TikTok Length -->
      <div>
        <label class="text-[11px] text-gray-300 mb-1.5 block">TikTok 動画尺</label>
        <div class="flex gap-2">
          <button id="tiktok-15s" onclick="setTiktokLength('15秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">15秒</button>
          <button id="tiktok-30s" onclick="setTiktokLength('30秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all btn-active">30秒</button>
          <button id="tiktok-60s" onclick="setTiktokLength('60秒')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">60秒</button>
        </div>
      </div>

      <!-- note Word Count -->
      <div>
        <label class="text-[11px] text-gray-300 mb-1.5 block">note 記事文字数</label>
        <div class="flex gap-2">
          <button id="note-500" onclick="setNoteWords('500文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all btn-active">500文字</button>
          <button id="note-1000" onclick="setNoteWords('1000文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">1000文字</button>
          <button id="note-2000" onclick="setNoteWords('2000文字')" class="flex-1 py-1.5 rounded-lg bg-white/10 text-xs border border-white/20 transition-all">2000文字</button>
        </div>
      </div>
    </div>

    <!-- Mode Selection -->
    <div class="glass-card rounded-2xl p-5">
      <h3 class="text-sm font-bold gold-gradient-text mb-3 flex items-center gap-2">
        <i class="fa-solid fa-list-check"></i> バズタイトルを選択して生成
      </h3>
      
      <div class="space-y-2 text-xs">
        <button onclick="selectTheme('既読無視する男の本音、実は〇〇です')" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>① 「既読無視する男の本音、実は〇〇です」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme('『好き避け』と『嫌い避け』の見分け方')" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>② 「『好き避け』と『嫌い避け』の見分け方」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme('復縁できる女子が絶対にやらないLINE')" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>③ 「復縁できる女子が絶対にやらないLINE」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme('本命の女性にだけ無意識に出すサイン3選')" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>④ 「本命の女性にだけ無意識に出すサイン3選」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme('一瞬で冷められる沼らせLINEの共通点')" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>⑤ 「一瞬で冷められる沼らせLINEの共通点」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
      </div>
    </div>

    <!-- Output Section -->
    <div id="output-section" class="hidden space-y-4">
      <div class="glass-card rounded-2xl p-5 border-yellow-500/40">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs text-yellow-400 font-bold"><i class="fa-solid fa-check-circle"></i> 生成完了</span>
          <button onclick="copyAll()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full text-gray-200">
            <i class="fa-regular fa-copy"></i> 全体コピー
          </button>
        </div>
        
        <div id="result-content" class="text-xs text-gray-200 space-y-4 whitespace-pre-wrap leading-relaxed max-h-[500px] overflow-y-auto p-3 bg-black/40 rounded-lg border border-white/5">
          <!-- 生成結果挿入域 -->
        </div>
      </div>
    </div>

  </main>

  <script>
    let tiktokLength = '30秒';
    let noteWords = '500文字';

    function setTiktokLength(len) {
      tiktokLength = len;
      ['15s', '30s', '60s'].forEach(id => {
        document.getElementById('tiktok-' + id).classList.remove('btn-active');
      });
      document.getElementById('tiktok-' + len.replace('秒', 's')).classList.add('btn-active');
    }

    function setNoteWords(words) {
      noteWords = words;
      ['500', '1000', '2000'].forEach(id => {
        document.getElementById('note-' + id).classList.remove('btn-active');
      });
      document.getElementById('note-' + words.replace('文字', '')).classList.add('btn-active');
    }

    function selectTheme(title) {
      generateContent(title);
    }

    function generateContent(title) {
      const output = document.getElementById('output-section');
      const resultContent = document.getElementById('result-content');
      
      output.classList.remove('hidden');
      resultContent.innerHTML = `AIが構成・台本(${tiktokLength})・note記事(${noteWords})を一括生成中...`;

      output.scrollIntoView({ behavior: 'smooth' });

      setTimeout(() => {
        resultContent.innerHTML = `【バズ要素分析】
・動画タイトル：${title}
・設定：TikTok ${tiktokLength}動画 / note ${noteWords}程度
・推奨投稿時間（TikTok）：本日 21:30〜23:00（感情が高まるゴールデンタイム）

【TikTok台本（${tiktokLength}仕様）】
■動画タイトル：${title}
■冒頭フック：「LINE放置された…もう終わり？」って焦ってる人、ちょっと待って！
■本文（テンポ良く）：
男が既読無視する一番の理由は、実は「冷めたから」じゃありません。
1. 返信を後回しにする男性心理
2. 本命にしか見せない心の葛藤
3. 追わせる女子の神対応
■CTA：彼の本当の気持ちが気になる方は、プロフィール欄の「無料相性診断」をやってみてね！

【note記事本文（約${noteWords}）】
タイトル：${title}〜彼の本当の心理と追わせる女の共通点〜

「返信が来ない…」と不安になってスマホを何度も見てしまう夜、ありますよね。
実は彼が既読スルーする背景には、あなたが思う以上の心理的理由があります。

（中略：タイトルに添った詳細解説文章）

彼との相性や彼の本音を詳しく知りたい方は、プロフィールの無料相性診断をぜひ活用してみてくださいね。

#恋愛心理 #男性心理 #既読スルー #復縁 #無料診断

【画像生成プロンプト】
・TikTok用: Realistic vertical photo, a thoughtful Japanese woman looking at her phone, soft warm interior lighting, cinematic photography, 8k.
・note用: Soft pastel mood, aesthetic couple background, natural daylight, high resolution.`;
      }, 1200);
    }

    function copyAll() {
      const text = document.getElementById('result-content').innerText;
      navigator.clipboard.writeText(text);
      alert('生成内容をコピーしました！');
    }
  </script>
</body>
</html>
