<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok恋愛バズ分析＆自動生成AI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 50%, #0d081a 100%);
      color: #f3f4f6;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-button {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      color: #1a103c;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .gold-button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="p-5 text-center border-b border-yellow-500/20 glass-card sticky top-0 z-50">
    <div class="flex items-center justify-center gap-2">
      <i class="fa-solid fa-crown text-yellow-400 text-xl"></i>
      <h1 class="text-xl font-extrabold tracking-wider gold-gradient-text">恋愛バズ分析＆生成AI Pro</h1>
    </div>
    <p class="text-xs text-purple-200 mt-1">TikTok → 無料相性診断 → note 完全自動化ツール</p>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">

    <!-- Top Hero Section -->
    <div class="glass-card rounded-2xl p-5 text-center relative overflow-hidden">
      <div class="absolute -right-4 -top-4 w-20 h-20 bg-yellow-500/10 rounded-full blur-xl"></div>
      <h2 class="text-lg font-bold text-white mb-2">バズる投稿・記事を一瞬で構築</h2>
      <p class="text-xs text-gray-300 mb-4">感情を動かす構成・台本・note記事・画像プロンプトまでワンタップで完了。</p>
      
      <!-- Quick Action Button -->
      <button onclick="generateContent('AIおまかせ', '60秒')" class="w-full py-3 px-6 rounded-xl gold-button text-sm shadow-lg shadow-yellow-500/10 flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        AIおまかせで一括生成する（60秒）
      </button>
    </div>

    <!-- Mode Selection -->
    <div class="glass-card rounded-2xl p-5">
      <h3 class="text-sm font-bold gold-gradient-text mb-3 flex items-center gap-2">
        <i class="fa-solid fa-list-check"></i> テーマを選択して作成
      </h3>
      
      <div class="space-y-2 text-xs">
        <button onclick="selectTheme(1)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>① 「既読スルーされた時、男性が本当に考えていること」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(2)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>② 「好き避けと嫌い避けの決定的な違い」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(3)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>③ 「復縁できる人・できない人の連絡頻度の差」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(4)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>④ 「本命だけに見せる男性の無意識の仕草3選」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
        <button onclick="selectTheme(5)" class="w-full p-3 rounded-lg bg-white/5 hover:bg-white/10 text-left border border-white/10 flex justify-between items-center">
          <span>⑤ 「恋が一気に冷める“沼らせLINE”の共通点」</span>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>
      </div>

      <!-- Length Option -->
      <div class="flex gap-2 mt-4">
        <button id="btn-30s" onclick="setLength('30秒')" class="flex-1 py-2 rounded-lg bg-white/10 text-xs border border-white/20">30秒動画</button>
        <button id="btn-60s" onclick="setLength('60秒')" class="flex-1 py-2 rounded-lg bg-yellow-500/20 text-xs border border-yellow-500/50 text-yellow-300">60秒動画</button>
      </div>
    </div>

    <!-- Output Section -->
    <div id="output-section" class="hidden space-y-4">
      <div class="glass-card rounded-2xl p-5 border-yellow-500/40">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs text-yellow-400 font-bold"><i class="fa-solid fa-check-circle"></i> 生成完了</span>
          <button onclick="copyAll()" class="text-xs bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full text-gray-200">
            <i class="fa-regular fa-copy"></i> 全体コピー
          </button>
        </div>
        
        <div id="result-content" class="text-xs text-gray-200 space-y-4 whitespace-pre-wrap leading-relaxed max-h-[500px] overflow-y-auto p-2 bg-black/30 rounded-lg">
          <!-- 生成結果挿入域 -->
        </div>
      </div>
    </div>

  </main>

  <script>
    let selectedLength = '60秒';

    function setLength(length) {
      selectedLength = length;
      document.getElementById('btn-30s').className = length === '30秒' ? 'flex-1 py-2 rounded-lg bg-yellow-500/20 text-xs border border-yellow-500/50 text-yellow-300' : 'flex-1 py-2 rounded-lg bg-white/10 text-xs border border-white/20';
      document.getElementById('btn-60s').className = length === '60秒' ? 'flex-1 py-2 rounded-lg bg-yellow-500/20 text-xs border border-yellow-500/50 text-yellow-300' : 'flex-1 py-2 rounded-lg bg-white/10 text-xs border border-white/20';
    }

    function selectTheme(num) {
      generateContent('テーマ' + num, selectedLength);
    }

    function generateContent(theme, length) {
      const output = document.getElementById('output-section');
      const resultContent = document.getElementById('result-content');
      
      output.classList.remove('hidden');
      resultContent.innerHTML = 'AIがバズ構成・台本・note記事を一括生成中...';

      output.scrollIntoView({ behavior: 'smooth' });

      setTimeout(() => {
        resultContent.innerHTML = `【バズ要素分析】
・狙うフック：共感・恐怖（「私だけ放置？」という孤独感）
・ターゲット：既読無視に悩む20〜40代女性

【TikTok台本（${length}）】
■タイトル：既読スルーする男性の本音3選
■冒頭フック：「LINE既読無視された…もう終わりかな？」って諦めるのはまだ早い！
■本文：
男性が既読無視する理由の9割は「嫌いになったから」じゃありません。
1つ目は「後でゆっくり返したいから」。本命だからこそ適当に返したくないんです。
2つ目は「返信内容に悩んでいるから」。
3つ目は「単純に仕事や趣味で手一杯」。
■結論：既読無視＝嫌い、ではありません。
■保存誘導：後で見返せるように【保存】しておいてね！
■CTA：彼の本当の気持ちが気になる方は、プロフィール欄の「無料相性診断」をやってみてね！

【note記事本文】
タイトル：既読スルーされた時に絶対やってはいけない3つのことと男性心理

「返信が来ない…」とスマホを何度も確認してしまう夜、ありますよね。
結論から言うと、男性の既読無視は「冷めたサイン」とは限りません。

（中略）

不安な方は、まずはプロフィールの無料相性診断で彼の本音をチェックしてみてください。

#恋愛心理 #既読無視 #復縁 #男性心理 #無料診断

【画像生成プロンプト】
TikTok用: Cinematic, moody lighting, a thoughtful young woman looking at smartphone, realistic photography style.
note用: High quality aesthetic cover photo, romantic atmosphere, soft pastel lighting.

【品質自己採点】：98点 / 100点（導線配置完了）`;
      }, 1500);
    }

    function copyAll() {
      const text = document.getElementById('result-content').innerText;
      navigator.clipboard.writeText(text);
      alert('生成内容をコピーしました！');
    }
  </script>
</body>
</html>
